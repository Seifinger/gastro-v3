<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wirt-Portal</title>
<link rel="stylesheet" href="/styles.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7a3b2e">
</head>
<body>
<header>
  <h1>Wirt-Portal</h1>
  <button class="secondary" id="logout">Abmelden</button>
</header>
<main>
  <section>
    <h2>Übersicht</h2>
    <div class="kpi-row" id="kpis"></div>
  </section>

  <section>
    <h2>Reservierungen</h2>
    <label for="sort">Sortieren nach</label>
    <select id="sort"><option value="datum">Datum</option><option value="name">Name</option></select>
    <table id="reservierungen-table">
      <thead><tr><th>Name</th><th>Datum</th><th>Zeit</th><th>Pers.</th><th>Status</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>Bestellungen</h2>
    <div class="board">
      <div class="board-col"><h3>Neu</h3><div data-col="neu"></div></div>
      <div class="board-col"><h3>Zubereitung</h3><div data-col="zubereitung"></div></div>
      <div class="board-col"><h3>Bereit</h3><div data-col="bereit"></div></div>
    </div>
  </section>

  <section>
    <h2>Einstellungen</h2>
    <form class="settings" id="wartezeit-form">
      <label for="wartezeit">Zusätzliche Wartezeit (Minuten)</label>
      <input id="wartezeit" name="minuten" type="number" min="0" max="180">
      <button type="submit">Speichern</button>
    </form>
    <form class="settings" id="telegram-form">
      <label for="telegramChatId">Telegram Chat-ID (optional)</label>
      <input id="telegramChatId" name="chatId" type="text">
      <button type="submit">Speichern</button>
    </form>
    <form class="settings" id="noshow-form">
      <label><input type="checkbox" id="noShowAktiv" name="aktiv"> No-Show-Schutz aktiv</label>
      <label for="noShowGebuehr">Ausfallpauschale (€)</label>
      <input id="noShowGebuehr" name="gebuehrBetrag" type="number" min="0" step="0.5">
      <label for="noShowFenster">Stornofenster (Minuten)</label>
      <input id="noShowFenster" name="stornofensterMinuten" type="number" min="0" max="1440" value="30">
      <label for="noShowSchwelle">Warnschwelle (No-Shows)</label>
      <input id="noShowSchwelle" name="warnSchwelle" type="number" min="1" value="2">
      <button type="submit">Speichern</button>
    </form>
    <button class="secondary" id="enable-push">Push-Benachrichtigungen aktivieren</button>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
